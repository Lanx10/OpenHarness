[package]
name = "app"
version = "0.1.9"
description = "OpenHarness desktop app"
authors = ["Lanx"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22.1"
uuid = { version = "1.29.1", features = ["v4"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sha2 = "0.10"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }

[workspace]

