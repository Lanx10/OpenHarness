t-weight:650;letter-spacing:-.045em}.provider-panel{min-height:386px;display:grid;grid-template-columns:minmax(240px,37%) minmax(0,1fr);border:1px solid #2c2e2b;border-radius:11px;background:#1b1d1b;overflow:hidden}.provider-list{padding:13px 12px;border-right:1px solid #2d2f2c}.provider-row{width:100%;min-height:61px;padding:0 10px;display:grid;grid-template-columns:32px minmax(0,1fr) 14px;align-items:center;gap:11px;text-align:left;border:1px solid transparent;border-radius:7px;background:transparent;color:#c8ccc7}.provider-row:hover{background:#222421}.provider-row.selected{background:#252725;border-color:#343733}.provider-row:not(.selected) .provider-copy{opacity:.82}.provider-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;background:#222421;color:#d0d3ce}.provider-icon svg{width:16px;height:16px}.provider-icon.claude{color:#c57a48}.provider-icon.codex{color:#31a6c3}.provider-copy{min-width:0}.provider-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600}.provider-state{display:flex;align-items:center;gap:6px;margin-top:3px;color:#adb2ac;font-size:11px}.status-dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#777c76}.chevron{width:13px;height:13px;color:#b9bdb8}.detail{padding:25px 27px;min-width:0}.detail-title{display:flex;align-items:center;gap:9px;margin:0 0 23px;font-size:14px;font-weight:650;letter-spacing:-.025em}.detail-title svg{width:16px;height:16px}.help{width:13px;height:13px;border:0;border-radius:50%;padding:0;background:#40433e;color:#f2f2f2;font-size:9px;line-height:13px;text-align:center}.empty-title{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:13px;font-weight:600}.empty-title .help{background:#42453f}.outline-btn{height:34px;padding:0 13px;border:1px solid #383b37;border-radius:6px;background:#242624;color:#f2f2f2;font-size:12px;font-weight:550;transition:background .12s,border-color .12s}.outline-btn:hover{background:#2b2d2a;border-color:#4a4d48}.provider-added{padding:11px 0;border-top:1px solid #30322f;display:flex;align-items:center;justify-content:space-between;gap:12px}.provider-added:first-of-type{margin-top:18px}.added-info strong{display:block;font-size:12px}.added-info span{display:block;margin-top:3px;color:#aeb3ad;font-size:11px}.remove-provider{border:0;background:transparent;color:#c2c6c1;font-size:11px}.remove-provider:hover{color:#fff;text-decoration:underline}.update-panel{border:1px solid #2c2e2b;border-radius:11px;background:#1b1d1b;padding:22px 24px;max-width:540px}.update-panel h2{margin:0 0 8px;font-size:14px}.update-panel p{margin:0 0 17px;color:#b0b5af;font-size:12px}.update-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:15px;border-top:1px solid #30322f}.update-status{color:#bfc4bf;font-size:12px}.hidden{display:none!important}.backdrop{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:#0009}.backdrop.open{display:grid}.dialog{width:min(390px,calc(100vw - 28px));padding:20px;background:#1d1f1d;border:1px solid #3a3d39;border-radius:9px}.dialog h2{margin:0 0 5px;font-size:15px;letter-spacing:-.035em}.dialog p{margin:0 0 16px;color:#b0b5af;font-size:12px}.field{display:grid;gap:6px;margin-top:12px}.field label{color:#c2c6c1;font-size:11px}.field input{height:34px;padding:0 10px;border:1px solid #3a3d39;border-radius:6px;background:#151715;color:var(--fg);font-size:12px}.field input::placeholder{color:#a0a59f}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.dialog-actions button{height:32px;padding:0 12px;border:1px solid #393c38;border-radius:6px;background:#252725;color:#d5d8d3;font-size:11px}.dialog-actions .confirm{background:#e7eae5;color:#191a18;border-color:#e7eae5;font-weight:600}.dialog-actions .confirm:hover{background:#d4d8d1}.notice{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 12px;border:1px solid #41443f;border-radius:6px;background:#252725;color:#e4e7e2;font-size:11px;opacity:0;pointer-events:none;transition:opacity .15s}.notice.show{opacity:1}
@media(max-width:740px){.drawer{width:206px;flex-basis:206px;padding-inline:12px}.content{padding:28px 20px}.provider-panel{grid-template-columns:1fr}.provider-list{border-right:0;border-bottom:1px solid #2d2f2c;display:flex;gap:4px;overflow:auto}.provider-row{min-width:170px}.detail{padding:20px}}@media(max-width:520px){.drawer{width:168px;flex-basis:168px;padding:14px 9px}.drawer-heading{margin-left:8px}.drawer-heading h1{font-size:16px}.content{padding:24px 14px}.page-heading{margin-bottom:23px}.provider-panel{min-height:0}.provider-list{padding:8px}.provider-row{min-width:154px;grid-template-columns:28px minmax(0,1fr) 12px;gap:8px;padding:0 7px}.provider-icon{width:28px;height:28px}.detail{padding:18px}.window-control{width:34px}}@media(max-width:390px){.drawer{width:142px;flex-basis:142px;padding-inline:7px}.brand{gap:6px;font-size:11px}.brand-mark{width:21px;height:21px}.search input{font-size:11px}.content{padding-inline:10px}.provider-list{display:grid}.provider-row{width:100%}}
</style>
</head>
<body>
<div class="app"><aside class="rail" aria-label="Application navigation"><button class="rail-btn" id="home-button" aria-label="Home" title="Home"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="m2 9 8-7 8 7v8a1 1 0 0 1-1 1h-5v-5H8v5H3a1 1 0 0 1-1-1z"/></svg></button><button class="rail-btn active rail-bottom" id="gear-button" aria-label="Settings" title="Settings"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="m10 1.8 1.4 1.1 1.8-.1.9 1.6 1.7.7v1.8l1.2 1.3-.6 1.7.6 1.7-1.2 1.3v1.8l-1.7.7-.9 1.6-1.8-.1L10 18.8l-1.4-1.1-1.8.1-.9-1.6-1.7-.7v-1.8L3 12.4l.6-1.7L3 9l1.2-1.3V5.9l1.7-.7.9-1.6 1.8.1zM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6"/></svg></button></aside>
<aside class="drawer" data-od-id="settings-drawer"><div class="brand"><span class="brand-mark" aria-hidden="true">OH</span><span>OpenHarness</span></div><div class="drawer-heading"><h1>Settings</h1><button class="close-settings" id="close-settings" aria-label="Close settings" title="Close settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div><label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="settings-search" type="search" placeholder="Search settings" aria-label="Search settings"></label><nav class="nav" aria-label="Settings sections" data-od-id="settings-navigation"><button class="nav-item active" data-page="providers" aria-current="page">Model Providers</button><button class="nav-item" data-page="update">Update</button></nav><div class="drawer-foot">OPENHARNESS · SETTINGS</div></aside>
<section class="workspace"><header class="titlebar" data-od-id="settings-titlebar"><div class="tabs"><div class="tab"><span>New chat</span><button class="tab-close" id="close-tab" aria-label="Close tab"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="m3 3 6 6m0-6-6 6"/></svg></button></div><button class="new-tab" id="new-tab" aria-label="New tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3v10M3 8h10"/></svg></button></div><div class="drag" data-tauri-drag-region></div><div class="window-controls"><button class="window-control" title="Minimize" aria-label="Minimize window"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M3 8h10"/></svg></button><button class="window-control" title="Maximize" aria-label="Maximize window"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button><button class="window-control close" id="window-close" title="Close" aria-label="Close window"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div></header>
<main class="content" data-od-id="settings-content"><div class="content-inner"><h2 class="page-heading" id="page-heading" data-od-id="settings-heading">Model Providers</h2><section class="provider-panel" id="providers-page" data-od-id="model-providers-panel"><div class="provider-list" role="listbox" aria-label="Model providers"><button class="provider-row" data-provider="claude" role="option" aria-selected="false"><span class="provider-icon claude" aria-hidden="true">✳</span><span class="provider-copy"><span class="provider-name">Claude Code</span><span class="provider-state"><i class="status-dot"></i>Not connected</span></span></button><button class="provider-row" data-provider="codex" role="option" aria-selected="false"><span class="provider-icon codex" aria-hidden="true">✦</span><span class="provider-copy"><span class="provider-name">Codex</span><span class="provider-state"><i class="status-dot"></i>Not connected</span></span></button><button class="provider-row selected" data-provider="api" role="option" aria-selected="true"><span class="provider-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 3h10l1 8H4zm-1 10h12l1 3H3z"/></svg></span><span class="provider-copy"><span class="provider-name">API providers</span><span class="provider-state"><i class="status-dot"></i><span id="provider-count">None added</span></span></span><svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 3 5 5-5 5"/></svg></button></div><div class="detail"><h3 class="detail-title"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 3h10l1 8H4zm-1 10h12l1 3H3z"/></svg><span>API providers</span><button class="help" aria-label="API providers help" title="Configure compatible model APIs">?</button></h3><div id="empty-providers"><p class="empty-title">No API providers yet <button class="help" aria-label="No providers help" title="Add a compatible API provider">?</button></p><button class="outline-btn" id="add-provider" data-od-id="add-provider">Add provider</button></div><div id="provider-items" aria-live="polite"></div></div></section><section class="update-panel hidden" id="update-page" data-od-id="update-panel"><h2>OpenHarness updates</h2><p>Update availability is provided by the desktop application.</p><div class="update-row"><span class="update-status">Check for updates in the app.</span><button class="outline-btn" id="check-updates">Check for updates</button></div></section></div></main></section></div>
<div class="backdrop" id="provider-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><form class="dialog" id="provider-form"><h2 id="dialog-title">Add API provider</h2><p>Save a provider profile for this prototype.</p><div class="field"><label for="provider-name">Provider name</label><input id="provider-name" name="name" maxlength="48" required autocomplete="off" placeholder="e.g. My API"></div><div class="field"><label for="provider-endpoint">Base URL</label><input id="provider-endpoint" name="endpoint" type="url" required placeholder="https://api.example.com/v1"></div><div class="dialog-actions"><button type="button" id="cancel-provider">Cancel</button><button class="confirm" type="submit">Add provider</button></div></form></div><div class="notice" id="notice" role="status" aria-live="polite"></div>
<script>
(()=>{const $=id=>document.getElementById(id),storageKey='openharness-api-providers-v1';let providers=[];try{providers=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(providers))providers=[]}catch{providers=[]}const dialog=$('provider-dialog'),form=$('provider-form'),notice=$('notice');let noticeTimer;function tell(message){notice.textContent=message;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),1900)}function renderProviders(){const list=$('provider-items');list.replaceChildren();providers.forEach((provider,index)=>{const row=document.createElement('div');row.className='provider-added';const info=document.createElement('div');info.className='added-info';const name=document.createElement('strong');name.textContent=provider.name;const endpoint=document.createElement('span');endpoint.textContent=provider.endpoint;info.append(name,endpoint);const remove=document.createElement('button');remove.type='button';remove.className='remove-provider';remove.textContent='Remove';remove.setAttribute('aria-label',`Remove ${provider.name}`);remove.addEventListener('click',()=>{providers.splice(index,1);saveProviders();renderProviders()});row.append(info,remove);list.append(row)});$('empty-providers').classList.toggle('hidden',providers.length>0);$('provider-count').textContent=providers.length?`${providers.length} added`:'None added'}function saveProviders(){try{localStorage.setItem(storageKey,JSON.stringify(providers));tell('Provider list saved locally')}catch{tell('Could not save provider list')}}renderProviders();$('add-provider').addEventListener('click',()=>{dialog.classList.add('open');$('provider-name').focus()});$('cancel-provider').addEventListener('click',()=>dialog.classList.remove('open'));form.addEventListener('submit',event=>{event.preventDefault();if(!form.reportValidity())return;const name=$('provider-name').value.trim(),endpoint=$('provider-endpoint').value.trim();if(!name||!endpoint)return;providers.push({name,endpoint});saveProviders();renderProviders();form.reset();dialog.classList.remove('open')});dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.classList.remove('open')});document.addEventListener('keydown',event=>{if(event.key==='Escape')dialog.classList.remove('open')});document.querySelectorAll('.provider-row').forEach(row=>row.addEventListener('click',()=>{const selected=document.querySelector('.provider-row.selected');selected?.classList.remove('selected');selected?.setAttribute('aria-selected','false');row.classList.add('selected');row.setAttribute('aria-selected','true');if(row.dataset.provider!=='api')tell(`${row.querySelector('.provider-name').textContent} connection is handled by the desktop runtime`)}));document.querySelectorAll('.nav-item').forEach(button=>button.addEventListener('click',()=>{const active=document.querySelector('.nav-item.active');active?.classList.remove('active');active?.removeAttribute('aria-current');button.classList.add('active');button.setAttribute('aria-current','page');const providersPage=button.dataset.page==='providers';$('page-heading').textContent=providersPage?'Model Providers':'Update';$('providers-page').classList.toggle('hidden',!providersPage);$('update-page').classList.toggle('hidden',providersPage)}));$('settings-search').addEventListener('input',event=>{const query=event.target.value.trim().toLowerCase();document.querySelectorAll('.nav-item').forEach(button=>button.classList.toggle('hidden',!button.textContent.toLowerCase().includes(query)))});$('home-button').addEventListener('click',()=>location.href='desktop-ai-workbench.html');$('gear-button').addEventListener('click',()=>tell('Settings already open'));$('close-settings').addEventListener('click',()=>location.href='desktop-ai-workbench.html');$('window-close').addEventListener('click',()=>location.href='desktop-ai-workbench.html');$('close-tab').addEventListener('click',()=>location.href='desktop-ai-workbench.html');$('new-tab').addEventListener('click',()=>tell('New tab is handled by the desktop shell'));$('check-updates').addEventListener('click',()=>tell('Update checks are handled by the desktop runtime'));document.querySelectorAll('.window-control:not(.close)').forEach(button=>button.addEventListener('click',()=>tell(`${button.title} is handled by the desktop shell`)));console.assert(document.querySelectorAll('.nav-item').length===2,'Settings navigation should match reference');console.assert(document.querySelectorAll('.provider-row').length===3,'Provider list should show three provider types')})();
</script>
</body>
</html>
